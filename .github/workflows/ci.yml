# Harbor's CI: its unit tests and its manifests.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v

  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 - <<'PY'
          import glob, json
          for path in [*glob.glob(".claude-plugin/*.json"), "hooks/hooks.json"]:
              json.load(open(path))
              print("ok", path)
          # The version only changes in a release commit, which also dates its CHANGELOG entry.
          version = json.load(open(".claude-plugin/plugin.json"))["version"]
          assert f"\n## {version} — " in open("CHANGELOG.md").read(), f"CHANGELOG.md has no entry for {version}"
          print("ok CHANGELOG.md", version)
          PY
      # The zip every release attaches (harbor-plugin.zip): the manifest at its root, only the plugin inside.
      - run: scripts/package.sh HEAD dist/harbor-plugin.zip
